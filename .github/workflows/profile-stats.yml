name: Refresh profile stats
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards from public GitHub data
        id: stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stats.py
      - name: Generate contribution snake
        id: snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ runner.temp }}/github-snake.svg?palette=github-light
            ${{ runner.temp }}/github-snake-dark.svg?palette=github-dark
      - name: Save refreshed profile assets
        if: ${{ !cancelled() && steps.stats.outcome == 'success' }}
        env:
          SNAKE_OUTCOME: ${{ steps.snake.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg assets/streak.svg assets/stats.json
          if [ "$SNAKE_OUTCOME" = success ]; then
            cp "$RUNNER_TEMP"/github-snake.svg "$RUNNER_TEMP"/github-snake-dark.svg assets/
            git add assets/github-snake.svg assets/github-snake-dark.svg
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub profile assets'
            git push
          fi
