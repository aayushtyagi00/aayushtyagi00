    <rect x="292" y="91" width="22" height="10" rx="5" fill="#a78bfa" />
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="23" y="60" fill="#f2f6ff" font-size="27" font-weight="750">Memory AI</text>
    <text x="23" y="90" fill="#ced9ee" font-size="15">Search your notes and documents.</text>
