    <path d="M185 74h35l20 17" fill="none" stroke="#78d9ff" stroke-width="2" stroke-dasharray="5 5" />
    <path d="M247 46h98a12 12 0 0 1 12 12v42a12 12 0 0 1-12 12h-80l-20 10v-10a12 12 0 0 1-10-12V58a12 12 0 0 1 12-12Z" fill="#23305c" stroke="#a78bfa" />
    <path d="M254 66h72M254 79h58" stroke="#a8b9eb" stroke-width="4" stroke-linecap="round" />
    <rect x="253" y="91" width="31" height="10" rx="5" fill="#78d9ff" />
    <rect x="292" y="91" width="22" height="10" rx="5" fill="#a78bfa" />
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="23" y="60" fill="#f2f6ff" font-size="27" font-weight="750">Memory AI</text>
    <text x="23" y="90" fill="#ced9ee" font-size="15">Search your notes and documents.</text>
    <text x="23" y="110" fill="#ced9ee" font-size="15">Ask questions and get answers with sources.</text>
    <g fill="#e1eafe" font-size="11.5">
    <rect x="23" y="143" width="54" height="22" rx="11" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="50" y="158" text-anchor="middle">Gemini</text>
    <rect x="83" y="143" width="66" height="22" rx="11" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="116" y="158" text-anchor="middle">Supabase</text>
    </g>
    <rect x="297" y="137" width="98" height="34" rx="13" fill="#0b1222" fill-opacity=".76" stroke="#78d9ff" stroke-opacity=".68"/>
    <text x="308" y="159" fill="#f2f6ff" font-size="12" font-weight="650">Live demo</text>
    <path d="M372 154h12m-5-5 5 5-5 5" fill="none" stroke="#78d9ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke-width="3.7" stroke-linecap="round" filter="url(#border-glow)">
    <rect class="trail" x="7" y="7" width="406" height="174" rx="17" pathLength="1000" stroke="#4285f4" style="--offset:0px" />
