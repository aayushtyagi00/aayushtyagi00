<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 444 212" width="444" height="212">
  <defs>
    <linearGradient id="background">
      <stop stop-color="#101a32"/>
      <stop offset="1" stop-color="#493324"/>
    </linearGradient>
    <filter id="blend-colors" x="-470" y="-470" width="940" height="940" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="diffuse-halo" x="-12" y="-12" width="444" height="212" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7.4"/>
    </filter>
    <filter id="soft-edge" x="-12" y="-12" width="444" height="212" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
    <mask id="perimeter" x="-12" y="-12" width="444" height="212" maskUnits="userSpaceOnUse" style="mask-type:alpha">
      <rect x="7" y="7" width="406" height="174" rx="17" fill="none" stroke="#fff" stroke-width="14" opacity=".76" filter="url(#diffuse-halo)"/>
      <rect x="7" y="7" width="406" height="174" rx="17" fill="none" stroke="#fff" stroke-width="2.6" opacity=".52" filter="url(#soft-edge)"/>
    </mask>
  </defs>
  <style>
    .spectrum {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotate-glow 8.5s linear infinite;
    }
    @keyframes rotate-glow { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .spectrum { animation: none; } }
  </style>
  <g mask="url(#perimeter)" opacity=".92">
