<svg xmlns="http://www.w3.org/2000/svg" width="400" height="42" viewBox="0 0 400 42">
  <style>
    .cursor { animation: blink .82s steps(1, end) 4 both; }
    @keyframes blink { 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { display: none; } }
  </style>
  <text x="200" y="28" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="700" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">Ship fast. Learn faster.</text>
  <rect class="cursor" x="363" y="10" width="2" height="25" rx="1" fill="#22d3ee" />
</svg>
